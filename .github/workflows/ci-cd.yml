name: CI/CD for Topic 6

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Display repository files
        run: ls -la

      - name: CI Success
        run: echo "CI completed successfully!"

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Deployment
        run: echo "CD (Deployment) completed successfully!"